services:
  nginx-static:
    image: nginx:1.29.0-alpine
    volumes:
      - ./html:/usr/share/nginx/html:ro

  nginx-proxy:
    image: nginx:1.29.0-alpine
#    ports:
#      - "80:80"     # HTTP → redirect
#      - "443:443"   # HTTPS termination
    # the image fills ${...} of a template from the environment into conf.d at start
    environment:
      NGINX_PROXY_ACCESS_LOG: ${NGINX_PROXY_ACCESS_LOG:-/var/log/nginx/access.log main}
    volumes:
      - ./nginx-proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./ssl/nginx.crt:/etc/nginx/ssl/nginx.crt:ro
      - ./ssl/nginx.key:/etc/nginx/ssl/nginx.key:ro

  haproxy:
    image: haproxy:3.2.27-alpine
    # as root, as the NGINX master: the mounted key is readable by its owner only
    user: root
    # on: access log to standard out, as NGINX by default; off: none, see haproxy/haproxy.cfg
    environment:
      HAPROXY_ACCESS_LOG: ${HAPROXY_ACCESS_LOG:-on}
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./ssl/nginx.crt:/usr/local/etc/haproxy/nginx.crt:ro
      - ./ssl/nginx.key:/usr/local/etc/haproxy/nginx.crt.key:ro
