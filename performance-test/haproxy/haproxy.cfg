# HAProxy for the benchmark, set up like nginx-proxy: TLS 1.2 and 1.3 with the same certificate,
# HTTP/1.1 keep-alive to nginx-static. The key is mounted next to the certificate as
# nginx.crt.key, which HAProxy loads with it. HAPROXY_ACCESS_LOG=off switches the access log to
# standard out off, see docker-compose.yml and performance-test/benchmark.
global
  log stdout format raw local0

defaults
  mode http
  timeout connect 90s
  timeout client 90s
  timeout server 90s
.if streq("${HAPROXY_ACCESS_LOG}","on")
  log global
  option httplog
.endif

frontend https
  bind :443 ssl crt /usr/local/etc/haproxy/nginx.crt ssl-min-ver TLSv1.2
  option forwardfor
  http-request set-header X-Forwarded-Proto https
  default_backend static

backend static
  server static nginx-static:80
