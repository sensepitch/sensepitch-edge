name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# A new push cancels the run of the previous one on the same branch or pull request, so a series
# of pushes builds only the last. GitHub-hosted runners are free for public repositories.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source-date-epoch: ${{ steps.build-commit.outputs.source-date-epoch }}

    strategy:
      matrix:
        java-version: [25]

    steps:
    # the whole history, for the newest commit changing a build input below
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    # The commit that names the version: the newest one changing an input of the JAR or the
    # image, see doc/design/oci-image.md. Every path counts except the excluded ones, which
    # change neither, so a new path counts by default. ci.yml counts: it sets the JDK and builds
    # the image. Needs the whole history, in a shallow clone the oldest commit adds every file.
    - name: Newest commit changing a build input
      id: build-ref
      run: |
        ref=$(git log -1 --format=%H -- . \
          ':(exclude,glob)*.md' \
          ':(exclude)doc' \
          ':(exclude)plans' \
          ':(exclude)charts' \
          ':(exclude)performance-test' \
          ':(exclude)src/test' \
          ':(exclude).github/dependabot.yml' \
          ':(exclude).github/scripts' \
          ':(exclude).github/workflows/flaky-tests.yml' \
          ':(exclude).github/workflows/nightly.yml' \
          ':(exclude).gitignore' \
          ':(exclude)LICENSE')
        test -n "$ref"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

    - name: Build, test and check
      run: ./mvnw clean verify -Dedge.build.ref=${{ steps.build-ref.outputs.ref }}

    # the commit time of the version, the timestamp of the image, as of the JAR entries
    - name: Build commit time
      id: build-commit
      run: |
        epoch=$(sed -n 's/^project.build.outputTimestamp=//p' target/edge-build-commit.properties)
        test -n "$epoch"
        echo "source-date-epoch=$epoch" >> "$GITHUB_OUTPUT"

    # line and branch coverage of unit and integration tests, from the JaCoCo report of verify
    - name: Coverage summary
      if: always() && hashFiles('target/site/jacoco/jacoco.csv') != ''
      run: |
        awk -F, 'NR > 1 { bm += $6; bc += $7; lm += $8; lc += $9 }
          END {
            print "### Coverage\n"
            print "| Counter | Covered |"
            print "|---|---|"
            printf "| Lines | %.1f %% (%d of %d) |\n", 100 * lc / (lm + lc), lc, lm + lc
            printf "| Branches | %.1f %% (%d of %d) |\n", 100 * bc / (bm + bc), bc, bm + bc
          }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v7
      with:
        name: sensepitch-edge-with-dependencies.jar
        path: target/sensepitch-edge-*-with-dependencies.jar
        retention-days: 7

    - name: Upload build reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: build-reports
        path: |
          target/surefire-reports/
          target/failsafe-reports/
          target/reports/apidocs/
          target/site/jacoco/
        retention-days: 7

    - name: Upload coverage for the badges
      uses: actions/upload-artifact@v7
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      with:
        name: jacoco-csv
        path: target/site/jacoco/jacoco.csv
        retention-days: 1

  # The container image ghcr.io/sensepitch/sensepitch-edge, the repository used by the Helm chart,
  # for pushes to main and v* tags. It packages the JAR that the build job verified and uploaded,
  # it never builds again (see doc/design/oci-image.md). The tag is the version in that JAR's
  # manifest (pom.xml version, a snapshot made unique by commit time and id); main also gets the
  # moving tag main. A v* tag marks a release commit: it must equal v<pom.xml version>, and the
  # image also gets latest. The image is reproducible: a commit that changes no build input (e.g.
  # documentation only) has the version of the previous one and pushes the same digest.
  image:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/sensepitch/sensepitch-edge

    steps:
    # Dockerfile and .dockerignore only
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Download the verified JAR
      uses: actions/download-artifact@v8
      with:
        name: sensepitch-edge-with-dependencies.jar
        path: target

    - name: Version of the built JAR
      id: version
      run: |
        version=$(unzip -p target/sensepitch-edge-*-with-dependencies.jar META-INF/MANIFEST.MF \
          | sed -n 's/^Implementation-Version: *//p' | tr -d '\r')
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Release tag matches the version
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match the pom.xml version $VERSION"
          exit 1
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to the GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # empty if this version was not pushed before
    - name: Digest pushed before for this version
      id: previous
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        # the plain template {{ .Manifest.Digest }} prints the whole text block, not the digest
        digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
          --format '{{ json .Manifest }}' 2>/dev/null | jq -r .digest || true)
        echo "digest=$digest" >> "$GITHUB_OUTPUT"

    - name: Image metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE }}
        tags: |
          type=raw,value=${{ steps.version.outputs.version }}
          type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
        flavor: |
          latest=false

    # Reproducible: the image and file timestamps are the build commit time, the labels name only
    # the repository and the version, no provenance attestation (it records the run).
    - name: Build and push
      id: push
      uses: docker/build-push-action@v7
      env:
        SOURCE_DATE_EPOCH: ${{ needs.build.outputs.source-date-epoch }}
      with:
        context: .
        file: ./Dockerfile
        outputs: type=registry,rewrite-timestamp=true
        provenance: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.version=${{ steps.version.outputs.version }}

    # A version names one image: a different digest means the build is not reproducible, e.g. a
    # new JDK patch in the build job compiled differently. The tag already points to the new one.
    - name: Same digest as before
      if: steps.previous.outputs.digest != ''
      env:
        PREVIOUS: ${{ steps.previous.outputs.digest }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        if [ "$PREVIOUS" != "$DIGEST" ]; then
          echo "::error::$IMAGE was $PREVIOUS for this version, the rebuild is $DIGEST"
          exit 1
        fi

    # the coordinates to pull: every pushed tag and the immutable digest
    - name: Image summary
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        {
          echo "### Image"
          echo
          echo "$TAGS" | sed '/^$/d; s/.*/- `&`/'
          echo "- \`$IMAGE@$DIGEST\`"
        } >> "$GITHUB_STEP_SUMMARY"

  # Coverage badges for the README, kept on the branch "badges" so main gets no generated commits.
  # The only job with write access to the repository, and only for pushes to main.
  badges:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Download coverage
      uses: actions/download-artifact@v8
      with:
        name: jacoco-csv
        path: coverage-csv

    # a Docker action, it sees only the workspace: paths are relative to it, not in runner.temp
    - name: Generate badges
      uses: cicirello/jacoco-badge-generator@v2
      with:
        jacoco-csv-file: coverage-csv/jacoco.csv
        badges-directory: generated-badges
        generate-branches-badge: true
        generate-workflow-summary: false

    - name: Publish badges
      run: |
        # copy, the container wrote the files as root; out of the workspace before the switch
        mkdir -p "$RUNNER_TEMP/badges"
        cp generated-badges/*.svg "$RUNNER_TEMP/badges/"
        if git fetch --depth 1 origin badges; then
          git checkout -B badges FETCH_HEAD
        else
          git checkout --orphan badges
          git rm -rfq .
        fi
        mkdir -p badges
        cp "$RUNNER_TEMP"/badges/*.svg badges/
        git add badges
        if git diff --cached --quiet; then
          echo "badges unchanged"
          exit 0
        fi
        git -c user.name='github-actions[bot]' \
          -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
          commit -q -m "coverage badges for $GITHUB_SHA"
        git push origin badges
