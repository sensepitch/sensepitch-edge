name: Build and push image

# Builds the shaded JAR and publishes the container image to the GitHub Container Registry at
# ghcr.io/sensepitch/sensepitch-edge, the repository used by the Helm chart.
#
# The image packages the JAR that the verify step built and tested, it is never
# rebuilt. Its tag is the version in that JAR's manifest (pom.xml version, a
# snapshot made unique by commit time and id), see doc/design/oci-image.md.
# main also gets the moving tag main. A v* tag marks a release commit: it must
# equal v<pom.xml version>, and the image also gets latest.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    # The full gate before the image is built: unit and integration tests, Spotless, the Javadoc
    # build and the JaCoCo coverage floor. The image packages the JAR built here.
    - name: Build, test and check
      run: ./mvnw clean verify

    - name: Version of the built JAR
      id: version
      run: |
        version=$(unzip -p target/sensepitch-edge-*-with-dependencies.jar META-INF/MANIFEST.MF \
          | sed -n 's/^Implementation-Version: *//p' | tr -d '\r')
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Release tag matches the version
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match the pom.xml version $VERSION"
          exit 1
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/sensepitch/sensepitch-edge
        tags: |
          type=raw,value=${{ steps.version.outputs.version }}
          type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
        flavor: |
          latest=false

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # persist the image layers between runs
        cache-from: type=gha
        cache-to: type=gha,mode=max
