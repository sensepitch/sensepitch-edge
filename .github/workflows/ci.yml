name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# A new push cancels the run of the previous one on the same branch or pull request, so a series
# of pushes builds only the last. GitHub-hosted runners are free for public repositories.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [25]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Build, test and check
      run: ./mvnw clean verify

    # line and branch coverage of unit and integration tests, from the JaCoCo report of verify
    - name: Coverage summary
      if: always() && hashFiles('target/site/jacoco/jacoco.csv') != ''
      run: |
        awk -F, 'NR > 1 { bm += $6; bc += $7; lm += $8; lc += $9 }
          END {
            print "### Coverage\n"
            print "| Counter | Covered |"
            print "|---|---|"
            printf "| Lines | %.1f %% (%d of %d) |\n", 100 * lc / (lm + lc), lc, lm + lc
            printf "| Branches | %.1f %% (%d of %d) |\n", 100 * bc / (bm + bc), bc, bm + bc
          }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v7
      with:
        name: sensepitch-edge-with-dependencies.jar
        path: target/sensepitch-edge-*-with-dependencies.jar
        retention-days: 7

    - name: Upload build reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: build-reports
        path: |
          target/surefire-reports/
          target/failsafe-reports/
          target/reports/apidocs/
          target/site/jacoco/
        retention-days: 7

    - name: Upload coverage for the badges
      uses: actions/upload-artifact@v7
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      with:
        name: jacoco-csv
        path: target/site/jacoco/jacoco.csv
        retention-days: 1

  # The container image ghcr.io/sensepitch/sensepitch-edge, the repository used by the Helm chart,
  # for pushes to main and v* tags. It packages the JAR that the build job verified and uploaded,
  # it never builds again (see doc/design/oci-image.md). The tag is the version in that JAR's
  # manifest (pom.xml version, a snapshot made unique by commit time and id); main also gets the
  # moving tag main. A v* tag marks a release commit: it must equal v<pom.xml version>, and the
  # image also gets latest.
  image:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    # Dockerfile and .dockerignore only
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Download the verified JAR
      uses: actions/download-artifact@v8
      with:
        name: sensepitch-edge-with-dependencies.jar
        path: target

    - name: Version of the built JAR
      id: version
      run: |
        version=$(unzip -p target/sensepitch-edge-*-with-dependencies.jar META-INF/MANIFEST.MF \
          | sed -n 's/^Implementation-Version: *//p' | tr -d '\r')
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Release tag matches the version
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match the pom.xml version $VERSION"
          exit 1
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/sensepitch/sensepitch-edge
        tags: |
          type=raw,value=${{ steps.version.outputs.version }}
          type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
        flavor: |
          latest=false

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # persist the image layers between runs
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Coverage badges for the README, kept on the branch "badges" so main gets no generated commits.
  # The only job with write access, and only for pushes to main.
  badges:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Download coverage
      uses: actions/download-artifact@v8
      with:
        name: jacoco-csv
        path: coverage-csv

    # a Docker action, it sees only the workspace: paths are relative to it, not in runner.temp
    - name: Generate badges
      uses: cicirello/jacoco-badge-generator@v2
      with:
        jacoco-csv-file: coverage-csv/jacoco.csv
        badges-directory: generated-badges
        generate-branches-badge: true
        generate-workflow-summary: false

    - name: Publish badges
      run: |
        # copy, the container wrote the files as root; out of the workspace before the switch
        mkdir -p "$RUNNER_TEMP/badges"
        cp generated-badges/*.svg "$RUNNER_TEMP/badges/"
        if git fetch --depth 1 origin badges; then
          git checkout -B badges FETCH_HEAD
        else
          git checkout --orphan badges
          git rm -rfq .
        fi
        mkdir -p badges
        cp "$RUNNER_TEMP"/badges/*.svg badges/
        git add badges
        if git diff --cached --quiet; then
          echo "badges unchanged"
          exit 0
        fi
        git -c user.name='github-actions[bot]' \
          -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
          commit -q -m "coverage badges for $GITHUB_SHA"
        git push origin badges
